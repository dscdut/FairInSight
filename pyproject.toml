[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "fairinsight-backend"
version = "0.1.0"
description = "FairInsight backend services and Legal AI orchestration layer"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
  { name = "FairInsight Team" }
]
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "orjson==3.11.0",
  "pydantic[email]==2.11.7",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.1.1",
  "bcrypt==4.3.0",
  "PyJWT==2.10.1",
  "asyncpg==0.30.0",
  "redis[hiredis]==6.2.0",
  "langgraph==0.6.5",
  "openai==1.99.9",
  "tenacity==9.1.2",
  "python-multipart==0.0.20",
  "aiofiles==24.1.0",
  "pypdf==5.9.0",
  "python-docx==1.2.0",
  "unidecode==1.4.0",
  "crawlkit==0.3.0"
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
  "types-redis==4.6.0.20241004"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "B",
  "I",
  "UP",
  "SIM",
  "C4",
  "ASYNC",
  "ANN"
]
ignore = [
  "ANN101",
  "ANN102"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = []

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["tests"]
