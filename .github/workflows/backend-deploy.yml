name: Backend Deploy

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy backend
        run: |
          cd /home/runner/apps/FairInSight

          git pull origin dev

          cd backend

          npm ci

          npm run build --if-present

          pm2 restart api --update-env

      - name: Notify success deployment
        run: echo "Deployment complete"