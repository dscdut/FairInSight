name: Backend Deploy

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Copy .env file
        run: cp ~/env/.env ./.env

      - name: Restart api server
        run: pm2 restart api --update-env

      - name: Notify success deployment
        run: echo "Deployment complete"
