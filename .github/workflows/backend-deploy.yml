name: Backend Deploy

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, fairinsight-be]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare server runtime files
        run: |
          mkdir -p /opt/fairinsight/backend/uploads
          test -f /opt/fairinsight/backend/.env
          cat > /opt/fairinsight/backend/docker-compose.yml <<'YAML'
          services:
            backend:
              image: fairinsight-backend:dev
              container_name: fairinsight-backend
              restart: unless-stopped
              env_file:
                - ./.env
              ports:
                - "3000:3000"
              volumes:
                - ./uploads:/app/src/core/uploads
          YAML

      - name: Build backend image
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: docker build -t fairinsight-backend:dev ./backend

      - name: Restart backend container
        working-directory: /opt/fairinsight/backend
        run: docker compose up -d --force-recreate

      - name: Verify backend container
        run: |
          docker inspect -f '{{.State.Running}}' fairinsight-backend | grep true
          docker ps --filter name=fairinsight-backend

      - name: Notify success deployment
        run: echo "Deployment complete"
