openapi: 3.1.0
info:
  title: Template Swagger API Documentation
  description: |-
    API documentation for the template projects, created by GDSC-DUT. This documentation offers detailed insights into the common API endpoints used across all templates.
  contact:
    email: contact@gdsc.dev
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3000
tags:
  - name: auth
    description: Authentication & session management
  - name: user
    description: User management (admin)
  - name: lawyer
    description: Lawyer directory & profiles
  - name: rating
    description: Lawyer ratings
  - name: report
    description: Reports & moderation
 
# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:
 
  #AUTH
 
  /api/v1/auth/register:
    post:
      tags:
        - auth
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: UserRegisterRequest
                  type: object
                  properties:
                    role:
                      type: string
                      enum: [user]
                      example: "user"
                    email:
                      type: string
                      example: "nguyenvana@example.com"
                      description: >
                        ^.*@.*\.(com|net|org)$
                        (The email address must contain at least one character before and after the '@' symbol,
                        and end with an extension like .com, .net, .org.)
                    password:
                      type: string
                      example: "Abc@123456"
                      description: >
                        ^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$
                        (Minimum eight characters, at least one letter (uppercase or lowercase) and one number.)
                    confirmPassword:
                      type: string
                      example: "Abc@123456"
                  required:
                    - role
                    - email
                    - password
                    - confirmPassword
 
                - title: LawyerRegisterRequest
                  type: object
                  properties:
                    role:
                      type: string
                      enum: [lawyer]
                      example: "lawyer"
                    email:
                      type: string
                      example: "luatsu@example.com"
                      description: >
                        ^.*@.*\.(com|net|org)$
                        (The email address must contain at least one character before and after the '@' symbol,
                        and end with an extension like .com, .net, .org.)
                    password:
                      type: string
                      example: "Abc@123456"
                      description: >
                        ^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$
                        (Minimum eight characters, at least one letter (uppercase or lowercase) and one number.)
                    confirmPassword:
                      type: string
                      example: "Abc@123456"
                    licenseNumber:
                      type: string
                      example: "LS-12345"
                    licenseIssuer:
                      type: string
                      example: "Bộ Tư pháp"
                    licenseIssueDate:
                      type: string
                      format: date
                      example: "2020-05-15"
                    licenseFile:
                      type: string
                      format: byte
                      description: Base64-encoded license file content.
                      example: "base64encodedfilecontent"
                    referralCode:
                      type: string
                      example: "REF888"
                  required:
                    - role
                    - email
                    - password
                    - confirmPassword
                    - licenseNumber
                    - licenseIssuer
                    - licenseIssueDate
                    - licenseFile
              discriminator:
                propertyName: role
            examples:
              user_example:
                summary: Register as user
                value:
                  role: "user"
                  email: "nguyenvana@example.com"
                  password: "Abc@123456"
                  confirmPassword: "Abc@123456"
              lawyer_example:
                summary: Register as lawyer
                value:
                  role: "lawyer"
                  email: "luatsu@example.com"
                  password: "Abc@123456"
                  confirmPassword: "Abc@123456"
                  licenseNumber: "LS-12345"
                  licenseIssuer: "Bộ Tư pháp"
                  licenseIssueDate: "2020-05-15"
                  licenseFile: "base64encodedfilecontent"
                  referralCode: "REF888"
      responses:
        "201":
          description: User registered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Đăng ký thành công }
              example:
                message: User registered successfully
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                user_register_error:
                  summary: User registration validation error
                  value:
                     
                    message: Invalid request data
                    details:
                      - "Email is required"
                      - "Password is required"
                      - "Email must be a valid email address"
                      - "Password must be at least 8 characters"
                      - "Role must be one of: user, lawyer"
                      - "Password and confirm password do not match"
                lawyer_register_error:
                  summary: Lawyer registration validation error
                  value:
                     
                    message: Invalid request data
                    details:
                      - "Email is required"
                      - "Password is required"
                      - "License number is required"
                      - "License issuer is required"
                      - "License issue date is required"
                      - "License file is required"
                      - "Email must be a valid email address"
                      - "Password must be at least 8 characters"
                      - "Password and confirm password do not match"
              
        "409":
          description: Email đã tồn tại 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Email already exists
        "500":
          $ref: "#/components/responses/InternalError"
 
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: nguyenvana@example.com
                password:
                  type: string
                  example: Abc@123456
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthTokens"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Invalid login data
                details: ["Login is required", "Password is required","Role must be one of: user, lawyer, admin"]
        "401":
          description: Unauthorized (invalid credentials or account not activated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                 
                message: Invalid email or password, or account not activated
        "500":
          $ref: "#/components/responses/InternalError"
 
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout
      operationId: logout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Logout successful }
        "401":
          description: Unauthorized (invalid or expired token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                 
                message: Invalid or expired token
        "500":
          $ref: "#/components/responses/InternalError"
 
  /api/v1/auth/refresh-token:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: New access token and refresh token
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
                      
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Invalid refresh token
                details: ["Refresh token is required"]
        "401":
          description: Unauthorized (invalid or expired refresh token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                 
                message: Invalid or expired refresh token
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/forgot-password:
    post:
      tags:
        - auth
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "nguyenvana@example.com"
                  description: >
                    ^.*@.*\.(com|net|org)$
                    (The email address must contain at least one character before and after the '@' symbol,
                    and end with an extension like .com, .net, .org.)
              required:
                - email
            example:
              email: "nguyenvana@example.com"
      responses:
        "200":
          description: OTP sent successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "OTP has been sent to your email"
              example:
                 
                message: "OTP has been sent to your email"
        "400":
          description: Invalid email format 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_email:
                  summary: Email format is invalid
                  value:
                     
                    message: "Invalid request data"
                    details:
                      - "Email is required"
                      - "Email must be a valid email address"
        "404":
          description: Email not found in the system 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                 
                message: "Email does not exist"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/verify-otp:
    post:
      tags:
        - auth
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "nguyenvana@example.com"
                otp:
                  type: string
                  example: "123456"
                  description: A 6-digit OTP code sent to the user's email.
              required:
                - email
                - otp
            example:
              email: "nguyenvana@example.com"
              otp: "123456"
      responses:
        "200":
          description: OTP verified successfully. Returns a reset token for password reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      resetToken:
                        type: string
                        description: A short-lived token used to authorize the password reset request.
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              example:
                data:
                  resetToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: Missing or invalid OTP format 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_otp:
                  summary: OTP is missing
                  value:
                     
                    message: "Invalid request data"
                    details:
                      - "OTP is required"
                invalid_otp_format:
                  summary: OTP format is invalid
                  value:
                     
                    message: "Invalid request data"
                    details:
                      - "OTP must be a 6-digit number"
        "401":
          description: OTP is incorrect or has expired 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                wrong_otp:
                  summary: OTP is incorrect
                  value:
                     
                    message: "Invalid OTP"
                    details:
                      - field: "otp"
                        issue: "OTP is incorrect"
                        hint: "Please check the OTP sent to your email"
                expired_otp:
                  summary: OTP has expired
                  value:
                     
                    message: "OTP has expired"
                    details:
                      - field: "otp"
                        issue: "OTP has expired"
                        hint: "Please request a new OTP"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/reset-password:
    post:
      tags:
        - auth
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  description: The token received after successfully verifying the OTP.
                newPassword:
                  type: string
                  example: "NewAbc@123456"
                  description: >
                    ^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$
                    (Minimum eight characters, at least one letter (uppercase or lowercase) and one number.)
                confirmNewPassword:
                  type: string
                  example: "NewAbc@123456"
              required:
                - token
                - newPassword
                - confirmNewPassword
            example:
              token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              newPassword: "NewAbc@123456"
              confirmNewPassword: "NewAbc@123456"
      responses:
        "200":
          description: Password reset successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Password has been reset successfully"
              example:
                 
                message: "Password has been reset successfully"
        "400":
          description: Invalid request data 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_fields:
                  summary: Required fields are missing
                  value:
                     
                    message: "Invalid request data"
                    details:
                      - "New password is required"
                      - "Confirm new password is required"
                weak_password:
                  summary: Password does not meet requirements
                  value:
                    message: "Invalid request data"
                    details:
                      - "Password must be at least 8 characters"
                      - "Password must contain at least one letter and one number"
                password_mismatch:
                  summary: Passwords do not match
                  value:
                    message: "Invalid request data"
                    details:
                      - "Password and confirm password do not match"
        "401":
          description: Unauthorized (invalid or expired token) 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Invalid or expired token"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Get current user's profile
      description: >
        Returns the current logged-in user's profile information
        to pre-fill the "Chỉnh sửa hồ sơ" form.
      operationId: getMyProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserProfile"
              example:
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  userCode: "LX-99283-AN"
                  avatar: "https://cdn.example.com/avatars/usr_001.jpg"
                  displayName: "Nguyễn Văn An"
                  email: "an.nguyen@lexjurist.ai"
                  phoneNumber: "090 123 4567"
                  birthDate: "1990-01-01"
                  address: "Số 123 Đường Lê Lợi, Phường Bến Thành, Quận 1, TP. Hồ Chí Minh"
                  membershipType: "premium"
                  joinedAt: "2025-12-01"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Unauthorized or insufficient permissions
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Internal server error
 
    patch:
      tags: [auth]
      summary: Update current user's profile
      description: >
        Allows a logged-in user to update their own personal information.
        Email is read-only and cannot be changed here.
        All fields are optional — only provided fields will be updated.
      operationId: updateMyProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Profile picture file (jpg, png). Max size 5MB.
                displayName:
                  type: string
                  maxLength: 100
                  example: "Nguyễn Văn An"
                  description: Display name shown on profile.
                phoneNumber:
                  type: string
                  example: "090 123 4567"
                  description: Phone number.
                birthDate:
                  type: string
                  format: date
                  example: "1990-01-01"
                  description: Date of birth (YYYY-MM-DD).
                address:
                  type: string
                  maxLength: 500
                  example: "Số 123 Đường Lê Lợi, Phường Bến Thành, Quận 1, TP. Hồ Chí Minh"
                  description: Residential address.
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserProfile"
              example:
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  userCode: "LX-99283-AN"
                  avatar: "https://cdn.example.com/avatars/usr_001.jpg"
                  displayName: "Nguyễn Văn An"
                  email: "an.nguyen@lexjurist.ai"
                  phoneNumber: "090 123 4567"
                  birthDate: "1990-01-01"
                  address: "Số 123 Đường Lê Lợi, Phường Bến Thành, Quận 1, TP. Hồ Chí Minh"
                  membershipType: "premium"
                  joinedAt: "2025-12-01"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_fields:
                  summary: Validation errors
                  value:
                    message: Invalid request data
                    details:
                      - "displayName must not exceed 100 characters"
                      - "birthDate must be a valid date (YYYY-MM-DD)"
                      - "address must not exceed 500 characters"
                invalid_avatar:
                  summary: Avatar file invalid
                  value:
                    message: Invalid request data
                    details:
                      - "avatar must be a jpg or png file"
                      - "avatar must not exceed 5MB"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Unauthorized or insufficient permissions
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Internal server error
 
  # USER
 
  /api/v1/users:
    get:
      tags: [user]
      summary:  Get list of users with pagination and filtering (admin)
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            userCode:
                              type: string
                              description: Mã định danh người dùng hiển thị trên bảng.
                              example: "USR-8291"
                            avatar:
                              type: string
                              format: uri
                              description: URL ảnh đại diện. Null nếu chưa có ảnh (hiển thị chữ viết tắt).
                              example: "https://cdn.example.com/avatars/usr_9023.jpg"
                            fullName:
                              type: string
                              example: "Nguyễn Huy"
                            email:
                              type: string
                              format: email
                              example: "huy.nguyen@juristai.vn"
                            role:
                              type: string
                              enum: [user, lawyer, admin]
                              description: >
                                Vai trò hiển thị dưới dạng badge màu trên bảng.
                                admin = xanh navy, lawyer = xanh dương, user = xám.
                              example: "admin"
                            status:
                              type: string
                              enum: [active, pending, banned]
                              description: >
                                Trạng thái tài khoản.
                                active = "Hoạt động" (chấm xanh),
                                pending = "Đang chờ" (chấm vàng),
                                banned = "Đã khóa" (chấm đỏ).
                              example: "active"
                            actions:
                              type: object
                              description: >
                                Các hành động khả dụng với người dùng này.
                                Nếu status = "pending" và role = "lawyer", trả về approve/reject.
                                Ngược lại trả về edit/view/lock.
                              properties:
                                type:
                                  type: string
                                  enum: [default, pending_lawyer]
                                  description: >
                                    "default" = hiển thị icon chỉnh sửa, xem, khóa.
                                    "pending_lawyer" = hiển thị nút "Chấp nhận" và "Từ chối".
                                  example: "default"
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 20
                          total:
                            type: integer
                            example: 2842
                          totalPages:
                            type: integer
                            example: 28
              example:
                data:
                  items:
                    - userCode: "USR-8291"
                      avatar: null
                      fullName: "Nguyễn Huy"
                      email: "huy.nguyen@juristai.vn"
                      role: "admin"
                      status: "active"
                      actions:
                        type: "default"
                    - userCode: "USR-9023"
                      avatar: "https://cdn.example.com/avatars/usr_9023.jpg"
                      fullName: "Lê Thị Mai"
                      email: "mai.le@hanoi.law"
                      role: "lawyer"
                      status: "pending"
                      actions:
                        type: "pending_lawyer"
                    - userCode: "USR-4412"
                      avatar: null
                      fullName: "Trần Văn Tú"
                      email: "vantu88@gmail.com"
                      role: "user"
                      status: "banned"
                      actions:
                        type: "default"
                  pagination:
                    page: 1
                    limit: 20
                    total: 2842
                    totalPages: 28
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Invalid query parameters
                details:
                  - "Invalid role value"
                  - "Invalid status value"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Unauthorized or insufficient permissions
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{id}/ban:
    patch:
      tags: [user]
      summary: Ban a user account (admin)
      operationId: banUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  example: "Tài khoản vi phạm điều khoản sử dụng."
                  description: Reason for banning the account (optional). Maximum 500 characters.
            examples:
              ban_with_reason:
                summary: Ban with reason
                value:
                  reason: "Tài khoản vi phạm điều khoản sử dụng."
              ban_no_reason:
                summary: Ban without reason
                value:
                  reason: null
      responses:
        "200":
          description: User banned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
