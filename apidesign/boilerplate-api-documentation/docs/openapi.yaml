  /api/v1/users/{id}/role:
    put:
      tags: [user]
      summary: Update user role (admin)
      operationId: updateUserRole
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: UpdateToUserOrAdmin
                  type: object
                  required: [role]
                  properties:
                    role:
                      type: string
                      enum: [user, admin]
                      example: "user"
                - title: UpdateToLawyer
                  type: object
                  required: [role, licenseNumber, licenseIssuer]
                  properties:
                    role:
                      type: string
                      enum: [lawyer]
                      example: "lawyer"
                    licenseNumber:
                      type: string
                      example: "LS-19283-HN"
                      description: Lawyer's license number.
                    licenseIssuer:
                      type: string
                      example: "Sở Tư Pháp Hà Nội"
                      description: Authority that issued the license.
              discriminator:
                propertyName: role
            examples:
              update_to_user:
                summary: Change to user role
                value:
                  role: "user"
              update_to_lawyer:
                summary: Change to lawyer role
                value:
                  role: "lawyer"
                  licenseNumber: "LS-19283-HN"
                  licenseIssuer: "Sở Tư Pháp Hà Nội"
              update_to_admin:
                summary: Change to admin role
                value:
                  role: "admin"
      responses:
        "200":
          description: User role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Role updated successfully
                  data:
                    type: object
                    properties:
                      fullName:
                        type: string
                        example: "Lê Thị Mai"
                      email:
                        type: string
                        format: email
                        example: "mai.le@hanoi.law"
                      avatar:
                        type: string
                        format: uri
                        example: "https://cdn.example.com/avatars/usr_9023.jpg"
                      role:
                        type: string
                        enum: [user, lawyer, admin]
                        example: "lawyer"
                      licenseInfo:
                        type: object
                        description: Only present when role is "lawyer". Null for other roles.
                        properties:
                          licenseNumber:
                            type: string
                            example: "LS-19283-HN"
                          licenseIssuer:
                            type: string
                            example: "Sở Tư Pháp Hà Nội"
                          licenseFileUrl:
                            type: string
                            format: uri
                            example: "https://cdn.example.com/licenses/usr_9023_license.pdf"
              example:
                data:
                  fullName: "Lê Thị Mai"
                  email: "mai.le@hanoi.law"
                  avatar: "https://cdn.example.com/avatars/usr_9023.jpg"
                  role: "lawyer"
                  licenseInfo:
                    licenseNumber: "LS-19283-HN"
                    licenseIssuer: "Sở Tư Pháp Hà Nội"
                    licenseFileUrl: "https://cdn.example.com/licenses/usr_9023_license.pdf"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code: { type: integer }
                  message: { type: string }
                  details:
                    type: array
                    items:
                      type: string
              examples:
                invalid_role:
                  summary: Invalid role value
                  value:
                    message: Invalid request data
                    details:
                      - "role must be one of: user, lawyer, admin"
                missing_license_info:
                  summary: Missing license info when role is lawyer
                  value:
                    message: Invalid request data
                    details:
                      - "licenseNumber is required when role is lawyer"
                      - "licenseIssuer is required when role is lawyer"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code: { type: integer }
                  message: { type: string }
              example:
                message: Unauthorized or insufficient permissions
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
