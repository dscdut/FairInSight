  /api/v1/lawyers/profile:
    patch:
      tags:
        - lawyer
      operationId: updateMyProfile
      summary: Update lawyer's own profile
      description: >
        Allows a logged-in lawyer to update their public profile content
        including avatar, biography, consulting fee, specializations, and career history.
        Legal info (fullName, licenseNumber, barAssociation) cannot be changed here.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Profile picture file (jpg, png). Max size 5MB.
                layerlienseNumber:
                  type: string
                  description: The lawyer's license number.
                barAssociation:
                  type: string
                  description: The bar association the lawyer belongs to.
                bio:
                  type: string
                  description: A short biography of the lawyer 
                sucessfulCases:
                  type: integer
                  example: 120
                  description: Total number of successful cases handled by the lawyer.
                careerHistory:
                  type: string
                  description: A text summary of the lawyer's career history.
                consultingFee:
                  type: integer
                  example: 2500000
                  description: Consulting fee per hour in VND.
                careerMilestones:
                  type: array
                  description: >
                    List of career milestones (e.g. certifications, notable cases, appointments).
