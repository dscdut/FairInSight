  # REPORT / MODERATION 
# ── REPORT LIST ────────────────────────────

  /api/v1/reports:
    get:
      tags: [report]
      summary: Get list of reports (admin/moderator)
      operationId: listReports
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (starts from 1)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page (max 100)
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, resolved]
          description: Filter by processing status
        - name: startDate
          in: query
          schema:
            type: string
            format: date
            example: "2023-01-01"
          description: Filter by start date (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
            example: "2023-10-31"
          description: Filter by end date (YYYY-MM-DD)
      responses:
        "200":
          description: List of reports retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            reportId:
                              type: string
                              example: "REP-001"
                            reporter:
                              type: object
                              properties:
                                displayName:
                                  type: string
                                  example: "LS. Nguyễn Văn A"
                                role:
                                  type: string
                                  enum: [user, lawyer]
                                  example: "lawyer"
                            target:
                              type: object
                              properties:
                                displayName:
                                  type: string
                                  example: "User_921"
                                role:
                                  type: string
                                  enum: [user, lawyer]
                                  example: "user"
                            reason:
                              type: string
                              example: "Phát ngôn thù ghét"
                            status:
                              type: string
                              enum: [pending, processing, resolved]
                              description: >
                                pending = "Chưa xử lý" (badge đỏ),
                                processing = "Chờ xử lý" (badge cam),
                                resolved = "Đã xử lý" (badge xám).
                              example: "pending"
                            severity:
                              type: string
                              enum: [normal, danger]
                              description: >
                                danger = badge "NGUY HIỂM" (đỏ),
                                normal = badge "BÌNH THƯỜNG" (xám).
                              example: "danger"
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 20
                          total:
                            type: integer
                            example: 150
                          totalPages:
                            type: integer
                            example: 8
              example:
                data:
                  items:
                    - reportId: "REP-001"
                      reporter:
                        displayName: "LS. Nguyễn Văn A"
                        role: "lawyer"
                      target:
                        displayName: "User_921"
                        role: "user"
                      reason: "Phát ngôn thù ghét"
                      status: "pending"
                      severity: "danger"
                    - reportId: "REP-002"
                      reporter:
                        displayName: "Anonymous_Legal"
                        role: "user"
                      target:
                        displayName: "LS. Trần Thị B"
                        role: "lawyer"
                      reason: "Spam hồ sơ giả"
                      status: "processing"
                      severity: "normal"
                    - reportId: "REP-003"
                      reporter:
                        displayName: "LS. Lê Hoàng C"
                        role: "lawyer"
                      target:
                        displayName: "TechAdvocate_88"
                        role: "user"
                      reason: "Vi phạm bản quyền"
                      status: "resolved"
                      severity: "normal"
                    - reportId: "REP-004"
                      reporter:
                        displayName: "JusticeSeeker"
                        role: "user"
                      target:
                        displayName: "LS. Phạm Thu D"
                        role: "lawyer"
                      reason: "Nghi ngờ sử dụng bằng giả"
                      status: "pending"
                      severity: "danger"
                  pagination:
                    page: 1
                    limit: 20
                    total: 4
                    totalPages: 1
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code: { type: integer }
                  message: { type: string }
                  details:
                    type: array
                    items:
                      type: string
              example:
                message: Invalid query parameters
                details: ["Invalid status value", 
                  "startDate must be before endDate",
                  "Invalid date format for startDate",
                  "Invalid date format for endDate"]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code: { type: integer }
                  message: { type: string }
              example:
                 
                message: Unauthorized or insufficient permissions
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

