          $ref: "#/components/responses/InternalError"

# Document
  /api/v1/documents:
    get:
      tags: [document]
      summary: Get list of legal documents
      operationId: getDocuments
      security:
        - BearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            example: "Luật Đất đai"
          description: Search by document title or document code.
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
            example: true
          description: Filter by active status. Omit to return all.
        - name: issuedDateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2024-01-01"
          description: Filter documents issued from this date (inclusive, YYYY-MM-DD).
        - name: issuedDateTo
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2024-12-31"
          description: Filter documents issued up to this date (inclusive, YYYY-MM-DD).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          description: Page number (1-based).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
          description: Number of items per page.
      responses:
        "200":
          description: Documents retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        documentID:
                          type: string
                          example: "12345"
                        title:
                          type: string
                          example: "Luật Đất đai 2024"
                        documentCode:
                          type: string
                          example: "31/2024/QH15"
                        isActive:
                          type: boolean
                          example: true
                        issuedDate:
                          type: string
                          format: date
                          example: "2024-01-18"
                        effectiveDate:
                          type: string
                          format: date
                          example: "2024-07-01"
                        sourceUrl:
                          type: string
                          format: uri
                          example: "https://thuvienphapluat.vn/van-ban/..."
                        version:
                          type: string
                          example: "v1"
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 42
                        description: Total number of matching documents.
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      totalPages:
                        type: integer
                        example: 3
              example:
