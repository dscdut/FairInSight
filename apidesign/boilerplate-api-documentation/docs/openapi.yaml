# Template
  /api/v1/templates:
    get:
      tags: [template]
      summary: Get list of legal templates
      operationId: listTemplates
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (starts from 1)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page (max 100)
        - name: search
          in: query
          schema:
            type: string
          description: Search by template name or category
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category (e.g. "Hợp đồng", "Đơn từ")
        - name: isNew
          in: query
          schema:
            type: boolean
          description: Filter newly added templates
        - name: isPremium
          in: query
          schema:
            type: boolean
          description: Filter by premium-only templates
      responses:
        "200":
          description: List of templates retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              example: "t1a2b3c4-d5e6-7890-abcd-ef1234567890"
                            title:
                              type: string
                              example: "Biểu mẫu hợp đồng"
                            description:
                              type: string
                              example: "Tìm và chọn một mẫu văn bản pháp lý để bắt đầu soạn thảo."
                            category:
                              type: string
                              example: "Hợp đồng"
                            isPremium:
                              type: boolean
                              description: Whether the template requires a premium account.
                              example: true
                            isNew:
                              type: boolean
                              description: Whether the template is newly added.
                              example: true
                            totalUsers:
                              type: integer
                              description: Number of users who have used this template.
                              example: 3200
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 20
                          total:
                            type: integer
                            example: 8
                          totalPages:
                            type: integer
                            example: 1
              example:
                data:
                  items:
                    - id: "t1a2b3c4-d5e6-7890-abcd-ef1234567890"
                      title: "Biểu mẫu hợp đồng"
                      description: "Tìm và chọn một mẫu văn bản pháp lý để bắt đầu soạn thảo."
                      category: "Hợp đồng"
                      isPremium: true
                      isNew: true
                      totalUsers: 3200
                    - id: "t2b3c4d5-e6f7-8901-bcde-f12345678901"
                      title: "Biểu mẫu hợp đồng"
                      description: "Tìm và chọn một mẫu văn bản pháp lý để bắt đầu soạn thảo."
                      category: "Hợp đồng"
                      isPremium: true
                      isNew: true
                      totalUsers: 3200
                  pagination:
                    page: 1
                    limit: 20
                    total: 8
                    totalPages: 1
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
              example:
                message: Unauthorized or insufficient permissions
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
              example:
                message: Internal server error

# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────
components:
 
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
 
  # PARAMETERS 
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: uuid of the resource
 
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: page number (starts from 1)
 
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: number of items per page (max 100)
 
  # SCHEMAS
  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        userCode:
          type: string
          description: User identifier displayed on UI (e.g. LX-99283-AN).
          example: "LX-99283-AN"
        avatar:
          type: string
          format: uri
          example: "https://cdn.example.com/avatars/usr_001.jpg"
        displayName:
          type: string
          example: "Nguyễn Văn An"
        email:
          type: string
          format: email
          description: Read-only. Cannot be changed via this endpoint.
          example: "an.nguyen@lexjurist.ai"
        phoneNumber:
          type: string
          example: "090 123 4567"
        birthDate:
          type: string
          format: date
          example: "1990-01-01"
        address:
          type: string
          example: "Số 123 Đường Lê Lợi, Phường Bến Thành, Quận 1, TP. Hồ Chí Minh"
        membershipType:
          type: string
          enum: [free, premium]
          description: Membership tier of the user.
          example: "premium"
        joinedAt:
          type: string
          format: date
          description: Date the user joined the platform.
          example: "2025-12-01"  
 
    ErrorResponse:
      type: object
      properties:
        error_code:
          type: integer
        message:
          type: string
        details:
          type: array
          items:
            type: string
 
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8
 
    UserBasic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        avatar:
          type: string
          format: uri
          example: https://cdn.example.com/avatars/user123.jpg
        email:
          type: string
          format: email
          example: nguyenvana@example.com
        fullName:
          type: string
          example: Nguyễn Văn A
        role:
          type: string
          enum: [user, lawyer, admin]
          example: user
        status:
          type: string
          enum: [active, inactive, banned]
          example: active
    UserDetail:
      allOf:
        - type: object
          properties:
            fullName:
              type: string
              example: Nguyễn Văn A
            birthDate:
              type: string
              format: date
              example: "1990-05-20"
            email:
              type: string
              format: email
              example: nguyenvana@example.com
            address:
              type: string
              example: 123 Lê Lợi, Quận 1, TP.HCM
            avatar:
              type: string
              format: uri
              example: https://cdn.example.com/avatars/user123.jpg\
 
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
      required:
        - accessToken
        - refreshToken
        
 
    LawyerBasic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        email:
          type: string
          format: email
          example: luatsu@example.com
        fullName:
          type: string
          example: Trần Thị B
        role:
          type: string
          enum: [lawyer]
          example: lawyer
        status:
          type: string
          enum: [active, inactive, pending_activation]
          example: active
        createdAt:
          type: string
          format: date-time
          example: "2023-03-10T09:00:00Z"

    LawyerSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        fullName:
          type: string
          example: Trần Thị B
        avatar:
          type: string
          format: uri
          example: https://cdn.example.com/avatars/lawyer456.jpg
        city:
          type: string
          example: Hà Nội
        specializations:
          type: array
          items:
            type: string
          example: [Hôn nhân & Gia đình, Dân sự]
        experience:
          type: integer
          example: 8
        averageRating:
          type: number
          format: float
          example: 4.6
        totalRatings:
          type: integer
          example: 34
 
    LawyerDetail:
      allOf:
        - $ref: "#/components/schemas/LawyerSummary"
        - type: object
          properties:
            phone:
              type: string
              example: "0912345678"
            address:
              type: string
              example: 45 Hoàng Diệu, Ba Đình, Hà Nội
            bio:
              type: string
              example: Luật sư với hơn 8 năm kinh nghiệm trong lĩnh vực dân sự và hôn nhân gia đình.
            licenseNumber:
              type: string
              example: LS-2016-005678
            status:
              type: string
              enum: [active, inactive, suspended]
              example: active
            createdAt:
              type: string
              format: date-time
              example: "2023-03-10T09:00:00Z"
            updatedAt:
              type: string
              format: date-time
              example: "2024-05-20T14:30:00Z"
 
    Rating:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
        lawyerId:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        userId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        score:
          type: number
          format: integer
          minimum: 1
          maximum: 5
          example: 4
        comment:
          type: string
          example: Luật sư tư vấn rất nhiệt tình và chuyên nghiệp.
 
    Report:
      type: object
      properties:
        reporterId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        targetId:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        targetType:
          type: string
          enum: [user, lawyer, review, post]
          example: lawyer
        reason:
          type: string
          example: fake_info 
        status:
          type: string
          enum: [pending, resolved, dismissed]
          example: pending
        evaluationNote:
          type: string
          enum: [Nguy hiểm,bình thường]
          example: Nguy hiểm
 
  # RESPONSE
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
             
            message: You do not have permission to access this resource
    NotFound:
      description: Resource not found 
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
             
            message: The requested resource was not found
 
    InternalError:
      description: Internal server error 
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
             
            message: Internal server error
