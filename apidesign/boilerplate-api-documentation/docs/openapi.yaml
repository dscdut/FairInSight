  /api/v1/reports/{id}:
    get:
      tags: [report]
      summary: Get report details (admin/moderator)
      operationId: getReportById
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Report details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reportId:
                        type: string
                        example: "REP-001"
                      createdAt:
                        type: string
                        format: date-time
                        example: "2023-10-24T14:30:00Z"
                      severity:
                        type: string
                        enum: [normal, danger]
                        example: "danger"
                        description: Mức độ báo cáo — "danger" hiển thị badge "KHẨN CẤP".
                      status:
                        type: string
                        enum: [pending, processing, resolved]
                        example: "pending"

                      # ── Reporter ────────────────────────────────
                      reporter:
                        type: object
                        properties:
                          userId:
                            type: string
                            example: "LAW-1029-X"
                          displayName:
                            type: string
                            example: "LS. Nguyễn Văn A"
                          avatar:
                            type: string
                            example: "https://cdn.example.com/avatars/LAW-1029-X.jpg"
                          role:
                            type: string
                            enum: [user, lawyer]
                            example: "lawyer"
                          metadata:
                            type: object
                            description: Extra info depending on role.
                            properties:
                              licenseNumber:
                                type: string
                                example: "Hà Nội #8821"
                                description: Shown if reporter is a lawyer.
                            example:
                              licenseNumber: "Hà Nội #8821"

                      # ── Target (người bị báo cáo) ────────────────
                      target:
                        type: object
                        properties:
                          userId:
                            type: string
                            example: "USR-8231-K"
                          displayName:
                            type: string
                            example: "User_9921"
                          avatar:
                            type: string
                            example: "https://cdn.example.com/avatars/USR-8231-K.jpg"
                          role:
                            type: string
                            enum: [user, lawyer]
                            example: "user"
                          metadata:
                            type: object
                            description: Extra info depending on role.
                            properties:
                              totalPreviousReports:
                                type: integer
                                example: 1
                                description: Số lần bị cảnh cáo trước đó.
                            example:
                              totalPreviousReports: 1

                      # ── Report Content ───────────────────────────
                      reason:
                        type: string
                        example: "Phát ngôn thù ghét"
                      content:
                        type: string
                        example: "Đối tượng liên tục gửi các yêu cầu tư vấn pháp luật có nội dung thù ghét nhắm vào một nhóm tôn giáo cụ thể..."

                      # ── Evidence Files ───────────────────────────
                      evidenceFiles:
                        type: array
                        items:
                          type: object
                          properties:
                            fileId:
                              type: string
                              example: "file_001"
                            fileName:
                              type: string
                              example: "Chat_Log_01.png"
                            fileType:
                              type: string
                              enum: [image, pdf, video, other]
                              example: "image"
                            fileUrl:
                              type: string
                              example: "https://cdn.example.com/evidence/Chat_Log_01.png"
                        example:
                          - fileId: "file_001"
                            fileName: "Chat_Log_01.png"
                            fileType: "image"
                            fileUrl: "https://cdn.example.com/evidence/Chat_Log_01.png"
                          - fileId: "file_002"
                            fileName: "Transcript.pdf"
                            fileType: "pdf"
                            fileUrl: "https://cdn.example.com/evidence/Transcript.pdf"

                      # ── Admin Decision (nếu đã xử lý) ───────────
                      adminDecision:
                        type: object
                        description: null if report has not been resolved yet.
                        properties:
                          action:
                            type: string
                            enum: [warn_user, ban_user, dismiss]
                            example: "warn_user"
                          note:
                            type: string
                            example: "Người dùng đã vi phạm lần đầu, cảnh cáo trước."
                          decidedAt:
                            type: string
                            format: date-time
                            example: "2023-10-25T09:00:00Z"
                          decidedBy:
                            type: string
                            example: "admin_001"
