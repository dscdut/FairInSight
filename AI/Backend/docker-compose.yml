services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govdoc-api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - uploads_data:/app/uploads

    deploy:
      resources:
        limits:
          memory: 1g

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: govdoc-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:15-alpine
    container_name: govdoc-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: govdoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  uploads_data:
  qdrant_data:
  postgres_data:
