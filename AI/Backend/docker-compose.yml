services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govdoc-api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - uploads_data:/app/uploads

    deploy:
      resources:
        limits:
          memory: 1g

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  uploads_data:
