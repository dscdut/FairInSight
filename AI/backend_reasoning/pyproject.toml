[project]
name = "fairinsight-backend"
version = "0.1.0"
description = "FairInSight — Hệ AI pháp lý suy luận (Reasoning Legal Workflow System)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- Web / API ---
    "fastapi>=0.129.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.2.1",
    # --- Database ---
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.6",
    "alembic>=1.15.0",
    "greenlet>=3.3.1",
    # --- LLM / Agent ---
    "langgraph>=0.2.0",
    "google-genai",
    "httpx>=0.27.0",
    # --- Reranker (cross-encoder bge-reranker-v2-m3, chạy CPU sau hybrid RRF) ---
    "sentence-transformers>=3.0.0",
    # --- Auth: verify JWT của BE Node (chung secret) để lấy user_id ---
    "pyjwt>=2.9.0",
    # --- Ingest: extraction / OCR ---
    "pymupdf>=1.24.0",
    "easyocr>=1.7.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # --- Utils ---
    "loguru>=0.7.3",
    "tenacity>=9.0.0",
    "rapidfuzz>=3.10.0",
    "cloudinary>=1.40.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Engine async global sống suốt phiên → dùng chung 1 event loop để asyncpg không
# bị "Event loop is closed" khi teardown giữa các test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
